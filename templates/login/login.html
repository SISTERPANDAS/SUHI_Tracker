<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUHI Tracker | Auth</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='login/login.css') }}">
</head>
<body class="bg-slate-950 text-white min-h-screen w-full flex flex-col justify-center overflow-x-hidden font-sans">

    <!-- Ambient Glow Blobs -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- Main Full-Width Split Container -->
    <div class="w-full min-h-screen grid grid-cols-1 lg:grid-cols-2 relative z-10">
        
        <!-- ================= LEFT COLUMN: HERO IMAGE & INFO ================= -->
        <div class="hero-section flex flex-col justify-between p-8 sm:p-12 lg:p-16 relative">
            <!-- Dark Gradient Overlay for Readability -->
            <div class="hero-overlay"></div>

            <!-- Top Header & Branding -->
            <div class="relative z-10">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 bg-teal-500/20 border border-teal-400/40 rounded-xl backdrop-blur-md">
                        <i data-lucide="building-2" class="w-6 h-6 text-teal-400"></i>
                    </div>
                    <span class="text-xl font-bold tracking-tight text-teal-300 drop-shadow">SUHI Tracker</span>
                </div>

                <!-- Main Hero Text -->
                <div class="mt-12 lg:mt-20 max-w-xl">
                    <h1 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold leading-tight text-white drop-shadow-lg tracking-tight">
                        SUHI TRACKER:
                    </h1>
                    <p class="text-lg sm:text-2xl font-semibold text-slate-100 mt-3 leading-snug drop-shadow-md">
                        Analyze India's Urban Expansion and Heat Island Dynamics
                    </p>
                    <p class="text-teal-400 font-bold text-xl sm:text-2xl mt-2 tracking-wide drop-shadow">
                        (Multi Decadal Data)
                    </p>
                </div>
            </div>

            <!-- Bottom Features Section -->
            <div class="relative z-10 mt-12">
                <div class="grid grid-cols-3 gap-3 sm:gap-4 max-w-lg">
                    <!-- Pill 1 -->
                    <div class="feature-card">
                        <div class="feature-icon-wrapper">
                            <i data-lucide="bar-chart-3" class="w-5 h-5 text-teal-300"></i>
                        </div>
                        <p class="feature-title">Urban Expansion Analysis</p>
                    </div>
                    <!-- Pill 2 -->
                    <div class="feature-card">
                        <div class="feature-icon-wrapper">
                            <i data-lucide="thermometer" class="w-5 h-5 text-teal-300"></i>
                        </div>
                        <p class="feature-title">Surface Urban Heat Island Monitoring</p>
                    </div>
                    <!-- Pill 3 -->
                    <div class="feature-card">
                        <div class="feature-icon-wrapper">
                            <i data-lucide="layers" class="w-5 h-5 text-teal-300"></i>
                        </div>
                        <p class="feature-title">Spatiotemporal Insights</p>
                    </div>
                </div>

                <!-- Copyright Footer -->
                <p class="mt-8 text-xs text-slate-300 font-medium drop-shadow">
                    © SUHI Tracker | All Rights Reserved
                </p>
            </div>
        </div>

        <!-- ================= RIGHT COLUMN: GLASSMORHPIC AUTH CARD ================= -->
        <div class="flex items-center justify-center p-6 sm:p-10 lg:p-16 relative z-10">
            
            <div class="glass-auth-box w-full max-w-md p-8 sm:p-10 rounded-3xl relative">
                
                <!-- Auth Toggle Tabs -->
                <div class="grid grid-cols-2 p-1.5 bg-slate-950/60 rounded-2xl border border-white/10 mb-6">
                    <button id="tab-login" class="tab-btn active-tab" onclick="switchAuthTab('login')">
                        Login
                    </button>
                    <button id="tab-signup" class="tab-btn text-slate-400 hover:text-white" onclick="switchAuthTab('signup')">
                        Sign Up
                    </button>
                </div>

                <!-- Notification Alert Box -->
                <div id="auth-alert" class="hidden mb-4 p-3.5 rounded-xl text-xs font-medium border"></div>

                <!-- Credentials Form -->
                <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                    <!-- Full Name (Sign Up only) -->
                    <div id="name-group" class="hidden">
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Full Name</label>
                        <div class="input-wrapper">
                            <i data-lucide="user" class="input-icon"></i>
                            <input type="text" id="user-name" placeholder="Enter your full name" class="auth-input">
                        </div>
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Email</label>
                        <div class="input-wrapper">
                            <i data-lucide="mail" class="input-icon"></i>
                            <input type="email" id="user-email" required placeholder="Enter your email" class="auth-input">
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
                        <div class="input-wrapper">
                            <i data-lucide="lock" class="input-icon"></i>
                            <input type="password" id="user-password" required placeholder="Enter your password" class="auth-input pr-10">
                            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
                                <i data-lucide="eye" id="eye-icon" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Forgot Password Link -->
                    <div id="forgot-pass-wrapper" class="flex justify-end pt-1">
                        <a href="#" class="text-xs text-teal-400 hover:underline">Forgot Password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submit-btn" class="w-full mt-2 py-3.5 px-4 bg-teal-600 hover:bg-teal-500 text-white font-bold rounded-xl shadow-lg shadow-teal-900/50 transition-all flex items-center justify-center gap-2">
                        <span id="btn-text">Login</span>
                    </button>
                </form>

                <!-- Divider -->
                <div class="relative my-6 text-center">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-700/60"></div></div>
                    <span class="relative px-3 bg-slate-900/80 text-xs text-slate-400 uppercase font-medium">or</span>
                </div>

                <!-- Google OAuth Button -->
                <button onclick="handleGoogleLoginMock()" class="w-full py-3 px-4 bg-white/5 hover:bg-white/10 border border-white/10 hover:border-white/20 text-white font-semibold rounded-xl transition-all flex items-center justify-center gap-3">
                    <svg class="w-4 h-4" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                    </svg>
                    <span class="text-sm">Login with Google</span>
                </button>
            </div>

        </div>

    </div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='login/login.js') }}"></script>
</body>
</html>
